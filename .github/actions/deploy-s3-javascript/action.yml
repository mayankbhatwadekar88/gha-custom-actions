name: 'Deploy to AWS S3'
description: 'Deploy to static website via AWS S3'
inputs:
  bucket: 
    description: "S3 bucket name"
    required: true
  bucket-region:
    description: "Region of the S3 bucket"
    required: false
    default: 'us-east-2'
  dist-folder:
    description: 'Folder containing deployed files'
    required: true
runs:
  using: 'node16'
  main: 'main.js'
